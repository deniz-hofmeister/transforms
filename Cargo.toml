[package]
name = "transforms"
description = "A transform library to track reference frames and provide transforms between them."
authors = ["Deniz Hofmeister"]
license = "MIT"
version = "3.0.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/deniz-hofmeister/transforms"
documentation = "https://docs.rs/transforms"
keywords = ["robotics", "transform", "3d", "coordinate"]
categories = [
    "science::robotics",
    "computer-vision",
    "embedded",
    "no-std",
    "mathematics",
]
include = [
    "/src",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/MIGRATION.md",
    "/LICENSE",
]

[features]
serde = ["dep:serde"]

[dependencies]
thiserror = { version = "2.0.20", default-features = false }
hashbrown = "0.17.1"
libm = { version = "0.2.16", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
approx = { version = "0.5.1", default-features = false }
proptest = "1.11.0"
# `float_roundtrip`: the default parser can read a 17-digit decimal one ulp
# off, and the serde tests assert `decode(encode(t)) == t` through JSON text.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
# Held at 0.7: criterion 0.8 declares rust-version 1.86, above this crate's
# MSRV of 1.85, and its rolling last-three-stables policy can raise that in
# any 0.8.x patch — dependabot is told to ignore 0.8 (.github/dependabot.yml).
# Console output only: `plotters` (the HTML report charts) is deliberately
# off — nobody reads the reports — and `cargo_bench_support` must be named
# explicitly or `cargo bench` stops working.
criterion = { version = "0.7.0", default-features = false, features = [
    "cargo_bench_support",
    "rayon",
] }

[[bench]]
name = "benchmarks"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Applies only when building this repository directly (benches inherit it);
# dependents compile this crate under their own profiles.
[profile.release]
codegen-units = 1
lto = true
