# Not named `transforms`: cargo-semver-checks scans every manifest under the
# repository root and refuses a package name defined twice. The library keeps
# the name, so the stub and its test still read `use transforms::*`.
[package]
name = "proto-api-stub"
version = "3.0.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "transforms"

[features]
serde = ["dep:serde"]

[dependencies]
thiserror = { version = "2.0.20", default-features = false }
hashbrown = "0.17.1"
libm = { version = "0.2.16", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.151"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
